<!DOCTYPE html>
<html>
    {{- partial "head.html" . -}}
    <body class='{{ if .IsHome }}home{{ end }} {{ if .Params.bodyClass }}{{- printf "page-%s" .Params.bodyClass -}}{{ end }}{{- if hugo.IsProduction -}}production{{else}}dev{{- end -}}'>
        <!-- Google Tag Manager (noscript) -->
        <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-WP7QK2W7"
        height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
        <!-- End Google Tag Manager (noscript) -->

        {{- partial "header.html" . -}}
        <div id="content">
        {{- block "main" . }}
        {{- end }}
        </div>
        {{- partial "footer.html" . -}}

        {{ $js := resources.Get "js/app.js" | js.Build (dict "minify" true "target" "es2015") |  resources.Fingerprint }}
        <script defer type="module" src="{{ $js.Permalink }}"></script>
    
    
        {{- partial "parts/base/scripts.html" . -}}
    </body>
</html>
